baseURL = "https://blog.lordsudo.com/"
languageCode = "en-us"
title = "Lord Sudo | Decrypting the labyrinth"
theme = "ledger"

googleAnalytics = "G-PKHW8DHTY4"

[params]
  description = "Records kept beyond the threshold"
  disableFingerprinting = true  
  author = "Lord Sudo"
  favicon = "/favicon/logo-transparent/favicon.ico"
  heroTitleLine1 = "Lord Sudo"
  tagline = "Decrypting the labyrinth"
  heroEyebrow = "Decrypting the labyrinth"
  heroIntro = [
    "Red teamer, CTF tactician and challenge author.",
    "*This is not a blog.*",
    "*It is a ledger* of engagements, exploits and the lessons in between.",
  ]

     [params.customCSS]
    customCSS = ["css/custom.css"]

    [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"   # Theme for dark mode
    lightTheme = "catppuccin-frappe"     # Theme for light mode

    [params.avatar]
    assetPath = "avatar/avatar.png"
    
[taxonomies]
  tag = "tags"

[[menu.main]]
  name = "Entries"
  url = "/posts/"
  weight = 20

[[menu.main]]
  name = "Log"
  url = "/log/"
  weight = 22

[[menu.main]]
  name = "Arsenal"
  url = "/arsenal/"
  weight = 25
  
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 30

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 40

[security]
  enableInlineShortcodes = true

[security.funcs]
  getenv = ["^HUGO_"]


[pagination]
  pagerSize = 10  # Entries per page

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      # Enable block-level attributes for blockquotes and other block elements
      # Required for blockquote render hooks (alerts/admonitions)
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.tableOfContents]        
      startLevel = 2
      endLevel = 3
      ordered = false
    [markup.highlight]
      codeFences = true
      guessSyntax = true
      noClasses = false
      style = "catppuccin-macchiato"  # Default style (will be overridden by theme-aware CSS)

# Social media links
[params.social]
    github   = "https://github.com/LordSudo"   
    linkedin = "https://www.linkedin.com/"  
    x        = "https://x.com/l0rd5ud0"
    discord  = "https://discord.com/users/860589214559240222"
    email = "mailto:info@lordsudo.com"

# Output formats for search index
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

# Sitemap configuration for SEO
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Admonitions Configuration
[params.admonitions]
    # Choose between "emoji" and "favicon" (image)
    alertStyle = "favicon" 

[privacy.googleAnalytics]
  anonymizeIP = true
  respectDoNotTrack = true
