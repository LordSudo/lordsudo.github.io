{{- /* Share row at the end of entries and logs. */ -}}
{{- $u := .Permalink }}
{{- $t := .Title }}
<div class="share" aria-label="Share this {{ if eq .Section "log" }}log{{ else }}entry{{ end }}">
  <span class="label">Share</span>
  <button type="button" class="share-btn" data-copy-url="{{ .Permalink }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg><span>Copy link</span>
  </button>
  <a class="share-btn icon" title="Share on LinkedIn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ $u }}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5V18M6 6v.01M10.5 18v-8.5M10.5 13.2c0-2 1.3-3.7 3.4-3.7s3.1 1.4 3.1 3.6V18"/></svg><span class="sr-only">LinkedIn</span>
  </a>
  <a class="share-btn icon" title="Share on X" href="https://x.com/intent/post?url={{ $u }}&amp;text={{ $t }}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5l-14 14" /></svg><span class="sr-only">X</span>
  </a>
  {{- with site.Home.OutputFormats.Get "rss" }}
  <a class="share-btn icon" title="RSS feed" href="{{ .RelPermalink }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a14 14 0 0 1 14 14M5 11a8 8 0 0 1 8 8M6 18v.01"/></svg><span class="sr-only">RSS</span>
  </a>
  {{- end }}
</div>
